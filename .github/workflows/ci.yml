name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  changelog:
    # a pull request adds its entry as changelog.d/<id>-<slug>.md and leaves CHANGELOG.md alone, so that
    # parallel pull requests never edit the same lines; a release pull request (branch release/<version>) writes it
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: The change adds a changelog fragment and leaves CHANGELOG.md to the release
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ "${HEAD_REF#release/}" != "$HEAD_REF" ]; then release=--release; else release=; fi
          node scripts/changelog.mjs check --base "$BASE" $release
  test:
    # Windows and macOS too: architects run facetkit next to Archicad on Windows; a check that only
    # passes on Linux is not a check they can rely on
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    defaults:
      run:
        # the same step text on every runner (Git Bash on Windows); the code under test still uses each platform's own shell
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm test
      - run: node bin/facet.mjs hypotheses --check HYPOTHESES.md
      - run: npm run audit
      - run: npm run benchmark -- --write
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.os }}-node${{ matrix.node }}-${{ github.sha }}
          path: benchmark/results/
      - run: npm run demo:proof
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow pypdf
      # `python`, not the npm scripts' `python3`: Windows runners have no python3 command
      - run: python -m unittest discover -s domains/viz/tests
      - run: python -m unittest discover -s domains/arch/tests
