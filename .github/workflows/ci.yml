name: ci
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    # Windows and macOS too: architects run facetkit next to Archicad on Windows; a check that only
    # passes on Linux is not a check they can rely on
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        node: [20, 22]
    defaults:
      run:
        # the same step text on every runner (Git Bash on Windows); the code under test still uses each platform's own shell
        shell: bash
    env:
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
      - run: git config --global user.name ci && git config --global user.email ci@example.invalid
      - run: npm test
      - run: node bin/facet.mjs hypotheses --check HYPOTHESES.md
      - run: npm run audit
      - run: npm run benchmark -- --write
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: benchmark-${{ matrix.os }}-node${{ matrix.node }}-${{ github.sha }}
          path: benchmark/results/
      - run: npm run demo:proof
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install numpy pillow pypdf
      # `python`, not the npm scripts' `python3`: Windows runners have no python3 command
      - run: python -m unittest discover -s domains/viz/tests
      - run: python -m unittest discover -s domains/arch/tests
