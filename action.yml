name: 'FacetKit Assurance'
description: 'Evidence-first verification, proof pack witness, and PR assurance report'

inputs:
  item-id:
    description: 'Item ID (auto-detected from branch/PR if omitted)'
    required: false
    default: ''
  min-level:
    description: 'Minimum required assurance level (L0-L4)'
    required: false
    default: 'L2'
  test-command:
    description: 'Custom test command for stateless CI mode'
    required: false
    default: ''
  github-token:
    description: 'GitHub token for posting PR comments'
    required: false
    default: ${{ github.token }}

outputs:
  level:
    description: 'Achieved assurance level (L0-L4)'
    value: ${{ steps.verify.outputs.level }}

runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'

    - name: Run FacetKit Verification
      id: verify
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
      run: |
        node "${{ github.action_path }}/bin/facet.js" ci-verify \
          ${{ inputs.item-id != '' && format('--item "{0}"', inputs.item-id) || '' }} \
          ${{ inputs.test-command != '' && format('--test-cmd "{0}"', inputs.test-command) || '' }} \
          --min-level "${{ inputs.min-level }}" \
          --post-pr \
          --out-proof "facetkit-proof-pack.json"

    - name: Upload Proof Pack
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: facetkit-proof-pack
        path: facetkit-proof-pack.json
        if-no-files-found: ignore
