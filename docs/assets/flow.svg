<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-labelledby="t d" xmlns:c2pa="http://c2pa.org/manifest">
<title id="t">facetkit: one item of work, from specification to an assurance level</title>
<desc id="d">Five steps run in order: specification and red tests, build, probe, proof, policy gate. The inspector sends the work back to the builder once. Evidence is recorded as the steps finish, and the assurance level rises from L0 claimed to L3 falsified.</desc>
<style>
:root{--bg:#fffefb;--panel:#f6f5f1;--ink:#1d1c1a;--mute:#6f6c66;--line:#d9d5cc;--ok:#2f8a57;--run:#b7791f;--bad:#c2413a;--accent:#3b5bdb;--chip:#eeece6}
@media (prefers-color-scheme:dark){:root{--bg:#161615;--panel:#1f1f1d;--ink:#ecebe6;--mute:#9a978f;--line:#34332f;--ok:#5fc48a;--run:#e0a94a;--bad:#f0766e;--accent:#8ea2ff;--chip:#272724}}
text{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;fill:var(--ink)}
.m{fill:var(--mute);font-size:11px}.h{font-size:14px;font-weight:600}.s{font-size:12px;fill:var(--mute)}
.box{fill:var(--panel);stroke:var(--line)}.wire{stroke:var(--line);stroke-width:2;fill:none}
.glow{fill:none;stroke:var(--run);stroke-width:2.5;opacity:0}.bar{fill:var(--ok);opacity:0}
.arc{stroke:var(--bad);stroke-width:2;stroke-dasharray:5 5;fill:none;opacity:0;animation:arc 14s infinite}
.arct{fill:var(--bad);font-size:11px;opacity:0;animation:arc 14s infinite}
.chip rect{fill:var(--chip)}.chip text{font-size:12px}.chip{opacity:0}
.lvl{font-size:20px;font-weight:700;opacity:0}
@keyframes a_spec{0%{opacity:1}10.9%{opacity:1}11%{opacity:0}100%{opacity:0}}@keyframes d_spec{0%{opacity:0}10.9%{opacity:0}11%{opacity:1}97%{opacity:1}100%{opacity:0}}@keyframes a_build{0%{opacity:0}10.9%{opacity:0}11%{opacity:1}24.9%{opacity:1}25%{opacity:0}49.9%{opacity:0}50%{opacity:1}60.9%{opacity:1}61%{opacity:0}100%{opacity:0}}@keyframes d_build{0%{opacity:0}24.9%{opacity:0}25%{opacity:1}42.9%{opacity:1}43%{opacity:0}60.9%{opacity:0}61%{opacity:1}97%{opacity:1}100%{opacity:0}}@keyframes a_probe{0%{opacity:0}24.9%{opacity:0}25%{opacity:1}35.9%{opacity:1}36%{opacity:0}100%{opacity:0}}@keyframes d_probe{0%{opacity:0}35.9%{opacity:0}36%{opacity:1}97%{opacity:1}100%{opacity:0}}@keyframes a_proof{0%{opacity:0}35.9%{opacity:0}36%{opacity:1}42.9%{opacity:1}43%{opacity:0}60.9%{opacity:0}61%{opacity:1}67.9%{opacity:1}68%{opacity:0}100%{opacity:0}}@keyframes d_proof{0%{opacity:0}67.9%{opacity:0}68%{opacity:1}97%{opacity:1}100%{opacity:0}}@keyframes a_close{0%{opacity:0}67.9%{opacity:0}68%{opacity:1}74.9%{opacity:1}75%{opacity:0}100%{opacity:0}}@keyframes d_close{0%{opacity:0}74.9%{opacity:0}75%{opacity:1}97%{opacity:1}100%{opacity:0}}@keyframes arc{0%{opacity:0}42.9%{opacity:0}43%{opacity:1}60.9%{opacity:1}61%{opacity:0}100%{opacity:0}}@keyframes c0{0%{opacity:0}10.9%{opacity:0}13%{opacity:1}97%{opacity:1}100%{opacity:0}}@keyframes c1{0%{opacity:0}35.9%{opacity:0}38%{opacity:1}97%{opacity:1}100%{opacity:0}}@keyframes c2{0%{opacity:0}37.9%{opacity:0}40%{opacity:1}97%{opacity:1}100%{opacity:0}}@keyframes c3{0%{opacity:0}67.9%{opacity:0}70%{opacity:1}97%{opacity:1}100%{opacity:0}}@keyframes c4{0%{opacity:0}74.9%{opacity:0}77%{opacity:1}97%{opacity:1}100%{opacity:0}}@keyframes l0{0%{opacity:1}67.9%{opacity:1}68%{opacity:0}100%{opacity:0}}@keyframes l1{0%{opacity:0}67.9%{opacity:0}68%{opacity:1}74.9%{opacity:1}75%{opacity:0}100%{opacity:0}}@keyframes l2{0%{opacity:0}74.9%{opacity:0}75%{opacity:1}81.9%{opacity:1}82%{opacity:0}100%{opacity:0}}@keyframes l3{0%{opacity:0}81.9%{opacity:0}82%{opacity:1}96.9%{opacity:1}97%{opacity:0}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.bar,.chip{opacity:1}.lvl:last-of-type{opacity:1}}
</style>
<rect width="880" height="300" rx="14" fill="var(--bg)" stroke="var(--line)"/>
<text x="30" y="36" class="h">One item, from a request to a stated level of trust</text>
<text x="850" y="36" text-anchor="end" class="m">journal: append-only · every box is an event</text>
<path class="wire" d="M170,95.0 L200,95.0"/>
<path class="wire" d="M340,95.0 L370,95.0"/>
<path class="wire" d="M510,95.0 L540,95.0"/>
<path class="wire" d="M680,95.0 L710,95.0"/>
<g><rect class="box" x="30" y="64" width="140" height="62" rx="9"/><rect class="bar" x="30" y="64" width="5" height="62" rx="2" style="animation:d_spec 14s infinite"/><rect class="glow" x="30" y="64" width="140" height="62" rx="9" style="animation:a_spec 14s infinite"/><text x="44" y="86" class="h">spec</text><text x="44" y="102" class="s">spec-falsifier</text><text x="44" y="117" class="m">clauses · red tests</text></g>
<g><rect class="box" x="200" y="64" width="140" height="62" rx="9"/><rect class="bar" x="200" y="64" width="5" height="62" rx="2" style="animation:d_build 14s infinite"/><rect class="glow" x="200" y="64" width="140" height="62" rx="9" style="animation:a_build 14s infinite"/><text x="214" y="86" class="h">build</text><text x="214" y="102" class="s">slice-builder</text><text x="214" y="117" class="m">smallest green diff</text></g>
<g><rect class="box" x="370" y="64" width="140" height="62" rx="9"/><rect class="bar" x="370" y="64" width="5" height="62" rx="2" style="animation:d_probe 14s infinite"/><rect class="glow" x="370" y="64" width="140" height="62" rx="9" style="animation:a_probe 14s infinite"/><text x="384" y="86" class="h">probe</text><text x="384" y="102" class="s">spec-falsifier</text><text x="384" y="117" class="m">mutants · seams</text></g>
<g><rect class="box" x="540" y="64" width="140" height="62" rx="9"/><rect class="bar" x="540" y="64" width="5" height="62" rx="2" style="animation:d_proof 14s infinite"/><rect class="glow" x="540" y="64" width="140" height="62" rx="9" style="animation:a_proof 14s infinite"/><text x="554" y="86" class="h">proof</text><text x="554" y="102" class="s">proof-inspector</text><text x="554" y="117" class="m">re-runs everything</text></g>
<g><rect class="box" x="710" y="64" width="140" height="62" rx="9"/><rect class="bar" x="710" y="64" width="5" height="62" rx="2" style="animation:d_close 14s infinite"/><rect class="glow" x="710" y="64" width="140" height="62" rx="9" style="animation:a_close 14s infinite"/><text x="724" y="86" class="h">close</text><text x="724" y="102" class="s">policy gate</text><text x="724" y="117" class="m">evidence → level</text></g>
<path class="arc" d="M610.0,126 C610.0,170 270.0,170 270.0,130"/><text class="arct" x="440.0" y="174" text-anchor="middle">REWORK → slice-builder: seam-break</text>
<text x="30" y="208" class="m">EVIDENCE — written by the tool that measured it</text>
<g class="chip" style="animation:c0 14s infinite"><rect x="30" y="220" width="87" height="26" rx="13"/><text x="73" y="237" text-anchor="middle">trace 9/9</text></g>
<g class="chip" style="animation:c1 14s infinite"><rect x="126.8" y="220" width="101" height="26" rx="13"/><text x="177" y="237" text-anchor="middle">mutate 0.92</text></g>
<g class="chip" style="animation:c2 14s infinite"><rect x="238.0" y="220" width="108" height="26" rx="13"/><text x="292" y="237" text-anchor="middle">neighbours ✓</text></g>
<g class="chip" style="animation:c3 14s infinite"><rect x="356.4" y="220" width="80" height="26" rx="13"/><text x="396" y="237" text-anchor="middle">checks ✓</text></g>
<g class="chip" style="animation:c4 14s infinite"><rect x="446.0" y="220" width="65" height="26" rx="13"/><text x="479" y="237" text-anchor="middle">scan ✓</text></g>
<text x="850" y="208" text-anchor="end" class="m">ASSURANCE LEVEL</text>
<text class="lvl" x="850" y="241" text-anchor="end" style="fill:var(--bad);animation:l0 14s infinite">L0 claimed</text>
<text class="lvl" x="850" y="241" text-anchor="end" style="fill:var(--run);animation:l1 14s infinite">L1 reproduced</text>
<text class="lvl" x="850" y="241" text-anchor="end" style="fill:var(--ok);animation:l2 14s infinite">L2 specified</text>
<text class="lvl" x="850" y="241" text-anchor="end" style="fill:var(--ok);animation:l3 14s infinite">L3 falsified</text>
<text x="30" y="278" class="m">Nothing closes on “done”. A policy over the recorded evidence decides, and the level says what the record supports.</text><metadata><c2pa:manifest></c2pa:manifest></metadata></svg>